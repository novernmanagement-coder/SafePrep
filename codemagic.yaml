workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.geraldmiller.safeprep
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing
        script: keychain initialize && app-store-connect fetch-signing-files com.geraldmiller.safeprep --type IOS_APP_STORE --create && keychain add-certificates && xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false