workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - ios_signing
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing
        script: keychain initialize && keychain add-certificates --certificate /Users/builder/Library/MobileDevice/Certificates/*.p12 --certificate-password @env:CERTIFICATE_PASSWORD && xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false